<meta property="og:image" content="https://lauraschneiderfineart.com/images/chandelier_2026.jpg">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:description" content="Laura Schneider is a Canadian contemporary oil painter creating still lifes that explore distortion, light, and the quiet beauty of everyday objects.">
<meta name="twitter:image" content="https://lauraschneiderfineart.com/images/chandelier_2026.jpg">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="icons/favicon.png"
  >
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img
      src="icons/lauralogo.png"
      alt="Laura Schneider Fine Art"
    >
  </a>

  <nav id="nav">
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="curriculum vitae.html">CV</a>
    <a href="contact.html">Contact</a>

    <a
      href="https://www.instagram.com/lauraschneiderfineart"
      target="_blank"
      rel="noopener noreferrer"
      class="social-icon"
    >
      <img
        src="icons/igicon.png"
        alt="Instagram"
      >
    </a>
  </nav>

  <button
    class="hamburger"
    type="button"
    onclick="toggleMenu()"
    aria-label="Open menu"
    aria-expanded="false"
  >
    ☰
  </button>
</header>


<section class="home-hero">

  <div class="hero-slideshow">
    <div class="hero-slide slide-one"></div>
    <div class="hero-slide slide-two"></div>
    <div class="hero-slide slide-three"></div>
    <div class="hero-slide slide-four"></div>
  </div>

  <div class="hero-content">
    <a
      href="gallery.html"
      class="recent-works-button"
    >
      View Gallery
    </a>
  </div>

</section>


<footer>
  <div class="footer-content">

    <p>
      © 2026 Laura Schneider. All rights reserved.
    </p>

    <div class="footer-socials">
      <a
        href="https://www.instagram.com/lauraschneiderfineart"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>
    </div>

  </div>
</footer>


<script>
  const nav = document.getElementById("nav");
  const hamburger = document.querySelector(".hamburger");

  function toggleMenu() {
    const isOpen = nav.classList.toggle("active");

    hamburger.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );
  }

  function closeMenu() {
    nav.classList.remove("active");
    hamburger.setAttribute("aria-expanded", "false");
  }

  document.addEventListener(
    "pointerdown",
    function (event) {
      if (!nav.classList.contains("active")) {
        return;
      }

      const clickedInsideNav =
        nav.contains(event.target);

      const clickedHamburger =
        hamburger.contains(event.target);

      if (
        !clickedInsideNav &&
        !clickedHamburger
      ) {
        closeMenu();
      }
    },
    true
  );

  nav.addEventListener(
    "click",
    function (event) {
      if (event.target.closest("a")) {
        closeMenu();
      }
    }
  );
</script>

</body>
</html>
