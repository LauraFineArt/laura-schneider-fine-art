<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Laura Schneider Fine Art | Contact</title>

  <meta
    name="description"
    content="Contact Laura Schneider regarding original paintings, prints, exhibitions, commissions, or general inquiries."
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="icons/favicon.png"
  >
</head>

<body>

<header>

  <a
    href="index.html"
    class="logo"
  >
    <img
      src="icons/lauralogo.png"
      alt="Laura Schneider Fine Art"
    >
  </a>

  <nav id="nav">

    <a href="gallery.html">
      Gallery
    </a>

    <a href="about.html">
      About
    </a>

    <a href="curriculum vitae.html">
      CV
    </a>

    <a href="contact.html">
      Contact
    </a>

    <a
      href="https://www.instagram.com/lauraschneiderfineart"
      target="_blank"
      rel="noopener noreferrer"
      class="social-icon"
      aria-label="Instagram"
    >
      <img
        src="icons/igicon.png"
        alt="Instagram"
      >
    </a>

  </nav>

  <button
    class="hamburger"
    type="button"
    onclick="toggleMenu()"
    aria-label="Open menu"
    aria-expanded="false"
  >
    ☰
  </button>

</header>


<section class="contact-section">

  <h2>Contact</h2>

  <p class="contact-info">
    Email:
    <a href="mailto:lauraschneiderfineart@gmail.com">
      lauraschneiderfineart@gmail.com
    </a>
  </p>

  <form
    id="contact-form"
    action="https://formspree.io/f/xvzewagn"
    method="POST"
  >

    <input
      type="text"
      name="name"
      placeholder="Name"
      required
    >

    <input
      type="email"
      name="email"
      placeholder="Email"
      required
    >

    <textarea
      name="message"
      placeholder="Message"
      rows="8"
      required
    ></textarea>

    <button type="submit">
      Send
    </button>

  </form>

</section>


<footer>

  <div class="footer-content">

    <p>
      © Laura Schneider Fine Art 2026
    </p>

    <div class="footer-socials">

      <a
        href="https://www.instagram.com/lauraschneiderfineart"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

    </div>

  </div>

</footer>


<script>
  const nav = document.getElementById("nav");
  const hamburger = document.querySelector(".hamburger");

  function toggleMenu() {
    const isOpen = nav.classList.toggle("active");

    hamburger.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );
  }

  function closeMenu() {
    nav.classList.remove("active");
    hamburger.setAttribute("aria-expanded", "false");
  }

  document.addEventListener(
    "pointerdown",
    function (event) {
      if (!nav.classList.contains("active")) {
        return;
      }

      const clickedInsideNav =
        nav.contains(event.target);

      const clickedHamburger =
        hamburger.contains(event.target);

      if (
        !clickedInsideNav &&
        !clickedHamburger
      ) {
        closeMenu();
      }
    },
    true
  );

  nav.addEventListener(
    "click",
    function (event) {
      if (event.target.closest("a")) {
        closeMenu();
      }
    }
  );


  const contactForm =
    document.getElementById("contact-form");

  contactForm.addEventListener(
    "submit",
    async function (event) {
      event.preventDefault();

      const formData =
        new FormData(contactForm);

      try {

        const response =
          await fetch(
            contactForm.action,
            {
              method: contactForm.method,
              body: formData,
              headers: {
                Accept: "application/json"
              }
            }
          );

        if (response.ok) {
          window.location.href =
            "thank-you.html";
        } else {
          alert(
            "Sorry, your message could not be sent. Please try again."
          );
        }

      } catch (error) {

        alert(
          "Sorry, your message could not be sent. Please check your connection and try again."
        );

      }
    }
  );
</script>

</body>

</html>
