<html lang="en">
<head>

  >

  <meta property="og:title" content="Laura Schneider Fine Art | Gallery">
<meta property="og:description" content="Browse original contemporary oil paintings by Laura Schneider.">
<meta property="og:image" content="https://lauraschneiderfineart.com/images/chandelier_2026.jpg">
<meta property="og:url" content="https://lauraschneiderfineart.com/gallery.html">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Laura Schneider Fine Art | Gallery">
<meta name="twitter:description" content="Browse original contemporary oil paintings by Laura Schneider.">
<meta name="twitter:image" content="https://lauraschneiderfineart.com/images/chandelier_2026.jpg">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="icons/favicon.png"
  >
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img
      src="icons/lauralogo.png"
      alt="Laura Schneider Fine Art"
    >
  </a>

  <nav id="nav">
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="curriculum vitae.html">CV</a>
    <a href="contact.html">Contact</a>

    <a
      href="https://www.instagram.com/lauraschneiderfineart"
      target="_blank"
      rel="noopener noreferrer"
      class="social-icon"
      aria-label="Instagram"
    >
      <img
        src="icons/igicon.png"
        alt="Instagram"
      >
    </a>
  </nav>

  <button
    class="hamburger"
    type="button"
    onclick="toggleMenu()"
    aria-label="Open menu"
    aria-expanded="false"
  >
    ☰
  </button>
</header>


<section class="gallery-section">

  <div class="gallery">

    <a
      href="painting.html?art=vortex"
      class="painting-link"
    >
      <img
        src="images/vortex_2026.jpg"
        alt="Vortex, 2026"
      >
    </a>

    <a
      href="painting.html?art=burning-match"
      class="painting-link"
    >
      <img
        src="images/burning_match_2026.jpg"
        alt="Burning Match, 2026"
      >
    </a>

    <a
      href="painting.html?art=chandelier"
      class="painting-link"
    >
      <img
        src="images/chandelier_2026.jpg"
        alt="Chandelier, 2026"
      >
    </a>

    <a
      href="painting.html?art=spellbound"
      class="painting-link"
    >
      <img
        src="images/spellbound_2026.jpg"
        alt="Spellbound, 2026"
      >
    </a>

    <a
      href="painting.html?art=limes"
      class="painting-link smaller-painting"
    >
      <img
        src="images/limes_2026.jpg"
        alt="Limes, 2026"
      >
    </a>

  </div>

</section>


<footer>
  <div class="footer-content">

    <p>© 2026 Laura Schneider. All rights reserved.</p>

    <div class="footer-socials">
      <a
        href="https://www.instagram.com/lauraschneiderfineart"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>
    </div>

  </div>
</footer>


<script>
  const nav = document.getElementById("nav");
  const hamburger = document.querySelector(".hamburger");

  function toggleMenu() {
    const isOpen = nav.classList.toggle("active");

    hamburger.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );
  }

  function closeMenu() {
    nav.classList.remove("active");
    hamburger.setAttribute("aria-expanded", "false");
  }

  document.addEventListener(
    "pointerdown",
    function (event) {
      if (!nav.classList.contains("active")) {
        return;
      }

      const clickedInsideNav = nav.contains(event.target);
      const clickedHamburger = hamburger.contains(event.target);

      if (
        !clickedInsideNav &&
        !clickedHamburger
      ) {
        closeMenu();
      }
    },
    true
  );

  nav.addEventListener("click", function (event) {
    if (event.target.closest("a")) {
      closeMenu();
    }
  });
</script>

</body>
</html>
